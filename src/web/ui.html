<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FileIndexr</title>
<style>
  :root {
    --bg-primary: #0f0f0f;
    --bg-secondary: #1a1a2e;
    --bg-tertiary: #16161e;
    --bg-input: #1e1e30;
    --border-color: #2a2a4a;
    --text-primary: #e0e0e0;
    --text-secondary: #888;
    --text-muted: #555;
    --accent: #7c83ff;
    --accent-hover: #6a71e0;
    --card-bg: #16161e;
    --card-border: #2a2a4a;
    --snippet-text: #ccc;
    --snippet-mark-bg: #5a5a1e;
    --snippet-mark-text: #ffd700;
    --hover-bg: #1a1a2e;
    --score-color: #5b5;
    --error-color: #f55;
    --badge-bg: #2a2a4a;
    --badge-text: #aaa;
    --modal-bg: #16161e;
    --modal-header-bg: #1a1a2e;
    --code-text: #d4d4d4;
    --button-bg: #2a2a4a;
    --button-hover: #3a3a5a;
    --overlay-bg: rgba(0,0,0,0.7);
  }
  [data-theme="light"] {
    --bg-primary: #ffffff;
    --bg-secondary: #f0f0f5;
    --bg-tertiary: #f8f8fc;
    --bg-input: #fff;
    --border-color: #ddd;
    --text-primary: #1a1a2e;
    --text-secondary: #666;
    --text-muted: #999;
    --accent: #5b63d5;
    --accent-hover: #4a52b8;
    --card-bg: #fff;
    --card-border: #e0e0e8;
    --snippet-text: #333;
    --snippet-mark-bg: #fff3a8;
    --snippet-mark-text: #1a1a1a;
    --hover-bg: #f0f0f5;
    --score-color: #2a7a2a;
    --error-color: #d32f2f;
    --badge-bg: #e8e8f0;
    --badge-text: #555;
    --modal-bg: #fff;
    --modal-header-bg: #f0f0f5;
    --code-text: #1a1a2e;
    --button-bg: #e8e8f0;
    --button-hover: #d0d0d8;
    --overlay-bg: rgba(0,0,0,0.4);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-primary); color: var(--text-primary); padding: 0; transition: background 0.2s, color 0.2s; }
  .header { background: var(--bg-secondary); padding: 16px 24px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
  .header h1 { font-size: 18px; color: var(--accent); white-space: nowrap; }
  .header .stats { margin-left: auto; font-size: 12px; color: var(--text-secondary); }
  .theme-toggle { background: none; border: 1px solid var(--border-color); color: var(--text-secondary); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; line-height: 1; transition: border-color 0.15s, color 0.15s; }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
  .search-bar { display: flex; gap: 8px; padding: 12px 24px; background: var(--bg-tertiary); border-bottom: 1px solid var(--border-color); flex-wrap: wrap; align-items: center; }
  .search-bar input[type="text"] { flex: 1; min-width: 200px; padding: 8px 12px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-size: 14px; outline: none; }
  .search-bar input[type="text"]:focus { border-color: var(--accent); }
  .search-bar select, .search-bar input[type="number"] { padding: 8px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: 6px; color: var(--text-primary); font-size: 13px; outline: none; }
  .search-bar button { padding: 8px 20px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; }
  .search-bar button:hover { background: var(--accent-hover); }
  .search-bar label { font-size: 12px; color: var(--text-secondary); display: flex; align-items: center; gap: 4px; }
  .search-bar input[type="checkbox"] { accent-color: var(--accent); }
  .results { padding: 16px 24px; }
  .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--text-secondary); }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 12px; font-size: 12px; color: var(--text-secondary); border-bottom: 1px solid var(--border-color); cursor: pointer; user-select: none; }
  th:hover { color: var(--accent); }
  td { padding: 8px 12px; border-bottom: 1px solid var(--bg-secondary); font-size: 13px; }
  tr:hover td { background: var(--hover-bg); }
  .path { color: var(--accent); cursor: pointer; text-overflow: ellipsis; overflow: hidden; }
  .path:hover { text-decoration: underline; }
  .filename { color: var(--text-primary); font-weight: 500; }
  .size { color: var(--text-secondary); text-align: right; white-space: nowrap; }
  .modified { color: var(--text-secondary); white-space: nowrap; }
  .ext-badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; background: var(--badge-bg); color: var(--badge-text); }
  .score { color: var(--score-color); font-weight: bold; }
  .empty { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; }
  .loading { text-align: center; padding: 40px; color: var(--accent); }
  /* Result cards */
  .result-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 14px 18px; margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s; }
  .result-card:hover { border-color: var(--accent); }
  .result-card .path { color: var(--accent); font-size: 13px; font-weight: 500; }
  .result-card .snippet { color: var(--snippet-text); font-size: 13px; line-height: 1.5; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .result-card .snippet mark { background: var(--snippet-mark-bg); color: var(--snippet-mark-text); border-radius: 2px; padding: 0 2px; }
  .result-card .meta { font-size: 11px; color: var(--text-secondary); margin-top: 6px; display: flex; gap: 16px; }
  .result-card .meta span { white-space: nowrap; }
  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay-bg); z-index: 200; overflow-y: auto; }
  .modal-overlay.active { display: block; }
  .modal { background: var(--modal-bg); margin: 40px auto; max-width: 80%; border-radius: 8px; border: 1px solid var(--card-border); overflow: hidden; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--modal-header-bg); border-bottom: 1px solid var(--border-color); }
  .modal-header h2 { font-size: 14px; color: var(--accent); word-break: break-all; }
  .modal-header button { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; padding: 0 4px; }
  .modal-header button:hover { color: var(--text-primary); }
  .modal-header .modal-action-btn { font-size: 13px !important; padding: 4px 10px !important; background: var(--button-bg) !important; color: var(--snippet-text) !important; border: 1px solid var(--accent) !important; border-radius: 4px; cursor: pointer; white-space: nowrap; margin-left: 4px; }
  .modal-header .modal-action-btn:hover { background: var(--button-hover) !important; color: var(--accent) !important; border-color: var(--accent-hover) !important; }
  .modal-body { padding: 16px 20px; }
  .modal-body pre { font-family: "Fira Code", "Cascadia Code", monospace; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-all; color: var(--code-text); }
  .modal-body .error { color: var(--error-color); }
  .modal-footer { padding: 8px 20px; border-top: 1px solid var(--border-color); display: flex; gap: 8px; }
  .modal-footer button { padding: 6px 14px; background: var(--button-bg); color: var(--snippet-text); border: none; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .modal-footer button:hover { background: var(--button-hover); }
  /* Structure view */
  .modal-body .structure-list { list-style: none; padding-left: 0; }
  .modal-body .structure-list li { padding: 3px 0; font-size: 13px; line-height: 1.6; }
  .modal-body .structure-item { display: flex; align-items: baseline; gap: 8px; }
  .modal-body .structure-text { color: var(--text-primary); cursor: pointer; }
  .modal-body .structure-text:hover { color: var(--accent); text-decoration: underline; }
  .modal-body .structure-lines { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
  .modal-body .structure-level-indicator { color: var(--text-secondary); font-size: 11px; min-width: 24px; }
  @media (max-width: 768px) {
    .search-bar { padding: 8px 12px; }
    .results { padding: 12px; }
    td, th { padding: 6px 8px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>FileIndexr</h1>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">&#9728;</button>
  <div class="stats" id="stats"></div>
</div>
<div class="search-bar">
  <input type="text" id="q" placeholder="Search files..." autofocus />
  <input type="text" id="ext" placeholder="ext" style="max-width:80px" />
  <input type="text" id="pathFilter" placeholder="path" style="max-width:140px" />
  <label><input type="checkbox" id="searchContent" checked /> content</label>
  <select id="sortBy"><option value="score">score</option><option value="modified">modified</option><option value="size">size</option><option value="path">path</option></select>
  <select id="sortOrder"><option value="desc">&#9660; desc</option><option value="asc">&#9650; asc</option></select>
  <button onclick="doSearch()">Search</button>
</div>
<div class="results" id="results">
  <div class="empty">Type a query and press Search, or press Enter in the search field.</div>
</div>

<div class="modal-overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 id="modalPath"></h2>
      <div style="display:flex;gap:8px;align-items:center">
        <button onclick="showFileContent()" class="modal-action-btn" id="btnContent">Content</button>
        <button onclick="showStructure()" class="modal-action-btn" id="btnStructure">Structure</button>
        <button onclick="openInNewTab()" class="modal-action-btn">Open in new tab</button>
        <button onclick="closeModal()" title="Close">&times;</button>
      </div>
    </div>
    <div class="modal-body"><pre id="modalContent"></pre></div>
  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let currentPath = '';
  let currentView = 'content'; // 'content' or 'structure'
  let cachedContent = '';
  let cachedStructure = null;

  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });

  async function doSearch() {
    const params = new URLSearchParams();
    const q = $('q').value.trim();
    const ext = $('ext').value.trim();
    const pathF = $('pathFilter').value.trim();
    if (q) params.set('q', q);
    if (ext) params.set('ext', ext);
    if (pathF) params.set('path', pathF);
    params.set('search_content', $('searchContent').checked);
    params.set('sort_by', $('sortBy').value);
    params.set('sort_order', $('sortOrder').value);
    params.set('max_results', 100);

    $('results').innerHTML = '<div class="loading">Searching...</div>';

    try {
      const res = await fetch('/search?' + params.toString());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      renderResults(data);
    } catch (err) {
      $('results').innerHTML = '<div class="empty">Error: ' + err.message + '</div>';
    }
  }

  function renderResults(data) {
    const container = $('results');
    container.innerHTML = '';

    if (!data.results || data.results.length === 0) {
      container.innerHTML = '<div class="empty">No results found.</div>';
      return;
    }

    const header = document.createElement('div');
    header.className = 'results-header';
    const timeStr = data.search_time_ms < 1 ? '<1ms' : data.search_time_ms.toFixed(1) + 'ms';
    header.innerHTML = '<span>' + data.total + ' result(s), ' + timeStr + '</span>';
    container.appendChild(header);

    for (const r of data.results) {
      const card = document.createElement('div');
      card.className = 'result-card';
      card.onclick = () => showFile(r.path);

      const pathDiv = document.createElement('div');
      pathDiv.className = 'path';
      if (r.dir) pathDiv.appendChild(document.createTextNode(r.dir + '/'));
      const nameSpan = document.createElement('span');
      nameSpan.className = 'filename';
      nameSpan.textContent = r.filename;
      pathDiv.appendChild(nameSpan);
      card.appendChild(pathDiv);

      if (r.snippet) {
        // Server-escaped HTML with <mark> highlighting; do not re-escape.
        const snippetDiv = document.createElement('div');
        snippetDiv.className = 'snippet';
        snippetDiv.innerHTML = r.snippet;
        card.appendChild(snippetDiv);
      }

      const metaDiv = document.createElement('div');
      metaDiv.className = 'meta';
      const ext = r.extension || '-';
      metaDiv.innerHTML = '<span>ext: ' + escapeHtml(ext) + '</span>';
      metaDiv.innerHTML += '<span>' + formatSize(r.size) + '</span>';
      if (r.modified) metaDiv.innerHTML += '<span>' + new Date(r.modified).toLocaleString() + '</span>';
      metaDiv.innerHTML += '<span>score: ' + r.score.toFixed(2) + '</span>';
      card.appendChild(metaDiv);

      container.appendChild(card);
    }
  }

  function showFile(path) {
    currentPath = path;
    cachedContent = '';
    cachedStructure = null;
    $('modalPath').textContent = path;
    $('overlay').classList.add('active');
    showFileContent();
  }

  function showFileContent() {
    if (!currentPath) return;
    currentView = 'content';
    updateViewButtons();
    if (cachedContent) {
      $('modalContent').textContent = cachedContent;
      return;
    }
    loadContent();
  }

  async function loadContent() {
    $('modalContent').textContent = 'Loading...';
    try {
      const res = await fetch('/file?path=' + encodeURIComponent(currentPath));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      cachedContent = await res.text();
      $('modalContent').textContent = cachedContent;
    } catch (err) {
      $('modalContent').innerHTML = '<span class="error">Error: ' + err.message + '</span>';
    }
  }

  async function showStructure() {
    if (!currentPath) return;
    currentView = 'structure';
    updateViewButtons();
    $('modalContent').textContent = 'Loading...';

    if (cachedStructure !== null) {
      renderStructure(cachedStructure);
      return;
    }

    try {
      const res = await fetch('/structure?path=' + encodeURIComponent(currentPath));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      cachedStructure = await res.json();
      renderStructure(cachedStructure);
    } catch (err) {
      $('modalContent').innerHTML = '<span class="error">Error: ' + err.message + '</span>';
    }
  }

  function renderStructure(data) {
    const container = $('modalContent');
    if (!data.headers || data.headers.length === 0) {
      container.innerHTML = '<div class="empty">No headings found.</div>';
      return;
    }

    let html = '<ul class="structure-list">';
    for (const h of data.headers) {
      const indent = (h.level - 1) * 20;
      html += '<li style="padding-left:' + indent + 'px">';
      html += '<span class="structure-item">';
      html += '<span class="structure-level-indicator">H' + h.level + '</span>';
      html += '<span class="structure-text" onclick="scrollToLine(' + h.start_line + ')" title="Lines ' + h.start_line + '–' + h.end_line + '">' + escapeHtml(h.text) + '</span>';
      html += '<span class="structure-lines">' + h.start_line + '–' + h.end_line + '</span>';
      html += '</span></li>';
    }
    html += '</ul>';
    container.innerHTML = html;
  }

  function scrollToLine(lineNum) {
    // Switch to content view and scroll to the line.
    if (currentView !== 'content') {
      showFileContent();
    }
    // The content is in a <pre> element — find the line.
    const pre = $('modalContent');
    if (!pre || pre.tagName !== 'PRE') return;
    const lines = pre.textContent.split('\n');
    let targetPos = 0;
    for (let i = 0; i < lineNum - 1 && i < lines.length; i++) {
      targetPos += lines[i].length + 1; // +1 for newline
    }
    // Create a range at the target position and scroll it into view.
    const range = document.createRange();
    const sel = window.getSelection();
    if (pre.firstChild && pre.firstChild.length >= targetPos) {
      range.setStart(pre.firstChild, targetPos);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      range.scrollIntoView({ block: 'start', behavior: 'smooth' });
      setTimeout(() => sel.removeAllRanges(), 300);
    }
  }

  function updateViewButtons() {
    const btnC = $('btnContent');
    const btnS = $('btnStructure');
    if (currentView === 'content') {
      btnC.style.borderColor = 'var(--accent)';
      btnC.style.color = 'var(--accent)';
      btnS.style.borderColor = 'transparent';
      btnS.style.color = '';
    } else {
      btnS.style.borderColor = 'var(--accent)';
      btnS.style.color = 'var(--accent)';
      btnC.style.borderColor = 'transparent';
      btnC.style.color = '';
    }
  }

  function closeModal(e) {
    if (!e || e.target === $('overlay')) {
      $('overlay').classList.remove('active');
    }
  }

  function openInNewTab() {
    window.open('/file?path=' + encodeURIComponent(currentPath), '_blank');
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Theme toggle
  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme');
    const next = current === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('fileindexr-theme', next);
    $('themeToggle').textContent = next === 'light' ? '\u2600' : '\u263E';
  }

  // Initialize theme from localStorage or system preference
  (function initTheme() {
    const saved = localStorage.getItem('fileindexr-theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
      $('themeToggle').textContent = saved === 'light' ? '\u2600' : '\u263E';
    } else if (window.matchMedia('(prefers-color-scheme: light)').matches) {
      document.documentElement.setAttribute('data-theme', 'light');
      $('themeToggle').textContent = '\u2600';
    }
  })();

  // Load stats on startup
  (async () => {
    try {
      const res = await fetch('/stats');
      if (res.ok) {
        const d = await res.json();
        $('stats').textContent = d.total_files_indexed.toLocaleString() + ' files indexed';
      }
    } catch {}
  })();
</script>
</body>
</html>
