[package]
name = "file_indexr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
itertools = "0.15"
thiserror = "2"
anyhow = "1"
tantivy = "0.26"
regex = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "sync", "time", "signal"] }
notify = "7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tower-http = { version = "0.5", features = ["cors"] }
html-to-markdown-rs = "3.10"
moka = { version = "0.12", features = ["sync"] }
unpdf = { version = "0.4" }
zip = "8.6.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
filetime = "0.2"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
